ext {
    // [출시감사 2026-08-02] 22 → 23. Google Play Billing 9.0.0 이 minSdk 23 을 요구해서
    //   매니페스트 병합이 실패했다(= 결제가 들어간 APK 를 아예 빌드할 수 없었다).
    // [2026-08-15 Capacitor 8] 23 → 24. Capacitor 8 의 최소값이다.
    //   빠지는 건 Android 6.0(2015, Marshmallow) 뿐이고 점유율 0.5% 미만이라 실질 영향 없다.
    minSdkVersion = 24

    // [2026-08-15 Capacitor 8] 35 → 36.
    //   Play 는 2026-08-31 부터 신규 제출에 API 36 을 요구한다. 그런데 targetSdk 35 에서
    //   쓰던 edge-to-edge opt-out(`windowOptOutEdgeToEdgeEnforcement`)은 36 에서 무시된다
    //   → 진짜 인셋 대응이 필수가 됐고, 그걸 처리하는 게 Capacitor 8 의 System Bars 다.
    //   그래서 "targetSdk 36" 과 "Capacitor 8" 은 따로 고를 수 있는 선택지가 아니라 한 묶음이다.
    compileSdkVersion = 36
    targetSdkVersion = 36

    // ⚠️ 아래 값들은 rootProject.ext 라서 Capacitor 의 기본값을 **덮어쓴다.**
    //   Capacitor 를 올릴 때 여기를 같이 안 올리면, 새 Capacitor 가 옛 androidx 위에서
    //   돌게 되어 compileSdk 36 해석에 실패한다("compile against version 36 or later").
    //   출처 = node_modules/@capacitor/android/capacitor/build.gradle 의 기본값(8.5.0 기준).
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'

    // [2026-08-15] 10.1.1 → 14.0.1. cordova-plugin-purchase(IAP)가 이 위에 얹힌다.
    //   결제는 매출 경로 전체라 업그레이드 후 **최우선으로 빌드 확인**할 것.
    cordovaAndroidVersion = '14.0.1'
}
