apply plugin: 'com.android.application'

// ⚠️ 패키지명이 iOS 와 다르다 — 의도된 것이다. 되돌리지 말 것.
//   Android = com.y2do.itdasy  (2026-04-23, Google Play 패키지명 충돌로 새 네임스페이스. CREDENTIALS_MAP.md:127)
//   iOS     = com.nopolab.itdasy (Apple 업로드 완료 → 변경 불가. CREDENTIALS_MAP.md:126)
//   루트 capacitor.config.json 의 appId(com.nopolab.itdasy)는 스캐폴딩용 기본값이라 iOS 쪽에 맞춰져 있고,
//   Android 는 여기 applicationId 가 이긴다. 둘이 다르다고 한쪽을 맞추면 스토어 등록분과 어긋난다.
//
// [출시감사 P0-A 2026-07-31] 과거 사고: 9662a5d(nopolab→y2do) → dc9547b(되돌림) → 1fae78e 가
//   이 파일만 다시 y2do 로 바꿔서, MainActivity.java 는 com/nopolab/itdasy/ 에 남았다.
//   매니페스트의 android:name=".MainActivity" 는 namespace 기준으로 해석되므로
//   존재하지 않는 com.y2do.itdasy.MainActivity 를 가리켰고 → APK 가 실행 즉시 크래시.
//   namespace · applicationId · java 디렉토리 경로 · package 선언 4개는 항상 같이 움직여야 한다.
android {
    namespace "com.y2do.itdasy"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.y2do.itdasy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // [2026-08-15 / 이 레포는 2026-09-07 반영] versionCode 는 CI 가 주입한다
        //   (ANDROID_VERSION_CODE = github.run_number).
        //   Play 는 업로드마다 이 값이 반드시 더 커야 하고, **한 번 쓴 번호는 영구 소진**된다.
        //   되돌릴 수도, 재사용할 수도 없다. 사람이 기억해서 올리는 방식은 반드시 한 번은 빠뜨리고,
        //   그때 업로드가 거부되면서 원인을 한참 찾게 된다 → 빌드 번호에 묶어 자동 증가시킨다.
        //   로컬 빌드는 값이 없어 1 로 떨어지는데, 로컬 산출물은 어차피 업로드하지 않으므로 무해하다.
        //   ⚠️ 괄호 앞에 공백을 두지 말 것. `versionCode (expr).toInteger()` 로 쓰면 Groovy 가
        //   `versionCode(expr)` 메서드 호출로 먼저 파싱하고 그 결과에 .toInteger() 를 붙인다
        //   → "A problem occurred evaluating project ':app'. > Value is null" 로 빌드가 죽는다.
        //   실제로 그렇게 썼다가 debug/release 양쪽 빌드를 한 번 날렸다(2026-08-15).
        //   ⚠️ 이 레포 AAB 는 Play 에 올리지 마라 — applicationId 가 운영과 같은
        //   com.y2do.itdasy 라, 여기 run_number 로 올리면 그 아래 번호가 운영 쪽에서도
        //   통째로 소진된다. Play 제출은 운영 레포(itdasy-frontend) 산출물로만.
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Google Play 소유권 인증·정식 배포용 서명 설정
    // 환경변수 ITDASY_KEYSTORE_* 로 비번 주입 (gradle 에 하드코딩 금지 — git 노출 방지)
    signingConfigs {
        release {
            def keystorePath = System.getenv("ITDASY_KEYSTORE") ?: (System.getProperty("user.home") + "/itdasy-release.jks")
            storeFile file(keystorePath)
            storePassword System.getenv("ITDASY_STORE_PASS") ?: ""
            keyAlias System.getenv("ITDASY_KEY_ALIAS") ?: "itdasy"
            keyPassword System.getenv("ITDASY_KEY_PASS") ?: ""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
