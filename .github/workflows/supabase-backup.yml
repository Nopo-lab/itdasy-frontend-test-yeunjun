name: Supabase Daily Backup

# 매일 UTC 18:00 (한국 03:00) Supabase 두 DB를 pg_dump → artifact 저장
#
# 🔴 이름과 실체가 반대다. 헷갈리면 복구 때 엉뚱한 걸 집는다.
#
#   시크릿                        Supabase 프로젝트                    실체
#   ────────────────────────────────────────────────────────────────────────────────
#   SUPABASE_STAGING_DB_URL      itdasy-staging                      🔴 실사용자 데이터가 여기 있다.
#                                (hsxxqomfbdernepykils)                 Cloud Run itdasy-backend-staging 이
#                                                                       쓰는 유일한 DB. 이름만 staging.
#   SUPABASE_PROD_DB_URL         beauty-platform                     ⚪ 이름만 운영. 현재 이 DB 를
#                                (wlwauinqvmegnqdtbrtg)                 쓰는 서비스는 없다.
#   SUPPORT_DISCORD_WEBHOOK      (선택) 실패 시 알림. 없으면 알림만 건너뜀
#
#   시크릿 이름은 옛 이름 그대로 둔다(바꾸면 다시 넣어야 함). 대신 백업 파일 이름은
#   LIVE / ARCHIVE 로 나가고, artifact 안에 README.txt 가 어느 걸 복구해야 하는지 적어둔다.
#
# ⚠️ 두 덤프는 서로 독립이다. 한쪽이 실패해도 다른 쪽은 반드시 시도한다.
#    (2026-09-03~06: ARCHIVE 쪽 인증 실패가 LIVE 스텝까지 skip 시켜 실데이터 백업이 4일 비었다)
# ⚠️ LIVE 를 먼저 뜬다. job 이 타임아웃으로 잘려도 중요한 쪽은 끝나 있게.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_REF: hsxxqomfbdernepykils
      ARCHIVE_REF: wlwauinqvmegnqdtbrtg
    steps:
      - name: Install postgresql-client v17 (Supabase Postgres 17 호환)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo sh /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Prepare backup directory
        run: |
          mkdir -p backup
          TS=$(date -u +%Y%m%d_%H%M)
          echo "BACKUP_TS=$TS" >> $GITHUB_ENV

      - name: Dump LIVE data (itdasy-staging — 실사용자 데이터)
        id: live
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL 미설정 — 실데이터 백업이 안 됩니다"
            exit 1
          fi
          FILE="backup/itdasy_LIVE_${LIVE_REF}_${BACKUP_TS}.sql.gz"
          # 실패하면 파일을 지운다 — 20바이트짜리 빈 gzip 이 artifact 에 섞이면
          # 나중에 그걸 백업인 줄 알고 집는다. 없는 편이 낫다.
          if ! /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-acl --format=plain "$DB_URL" | gzip > "$FILE"; then
            rm -f "$FILE"
            echo "::error::LIVE 덤프 실패 (접속·인증 확인)"
            exit 1
          fi
          ls -lh "$FILE"
          if [ $(stat -c%s "$FILE") -lt 1024 ]; then
            rm -f "$FILE"
            echo "::error::LIVE 덤프 파일이 너무 작습니다 (빈 백업). 1KB 이상이어야 정상."
            exit 1
          fi

      - name: Dump ARCHIVE (beauty-platform — 현재 미사용)
        id: archive
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_PROD_DB_URL 미설정 — ARCHIVE 백업 건너뜀"
            exit 0
          fi
          FILE="backup/itdasy_ARCHIVE_${ARCHIVE_REF}_${BACKUP_TS}.sql.gz"
          if ! /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-acl --format=plain "$DB_URL" | gzip > "$FILE"; then
            rm -f "$FILE"
            echo "::error::ARCHIVE 덤프 실패 (접속·인증 확인)"
            exit 1
          fi
          ls -lh "$FILE"
          if [ $(stat -c%s "$FILE") -lt 1024 ]; then
            rm -f "$FILE"
            echo "::error::ARCHIVE 덤프 파일이 너무 작습니다 (빈 백업). 1KB 이상이어야 정상."
            exit 1
          fi

      # artifact 안에 "어느 걸 복구해야 하나" 를 같이 넣는다.
      # 파일 이름만으로는 새벽에 급할 때 또 헷갈린다.
      - name: Write README into artifact
        if: always()
        shell: bash
        run: |
          LIVE_FILE="itdasy_LIVE_${LIVE_REF}_${BACKUP_TS}.sql.gz"
          ARCHIVE_FILE="itdasy_ARCHIVE_${ARCHIVE_REF}_${BACKUP_TS}.sql.gz"
          MARK() { [ -f "backup/$1" ] && echo "있음 ($(du -h "backup/$1" | cut -f1))" || echo "❌ 없음 — 이번 백업 실패"; }
          cat > backup/README.txt <<EOF
          잇데이 Supabase 백업 — ${BACKUP_TS} (UTC)

          ══════════════════════════════════════════════════════════════
          🔴 복구할 때 집어야 하는 건 이 파일입니다
          ══════════════════════════════════════════════════════════════
            ${LIVE_FILE}
            상태: $(MARK "$LIVE_FILE")

            실사용자 데이터(원장님 계정·고객·예약·매출)가 전부 여기 있습니다.
            앱 백엔드(Cloud Run itdasy-backend-staging)가 실제로 쓰는 DB입니다.
            Supabase 프로젝트 이름이 'itdasy-staging' 이라 연습용처럼 보이지만
            이름만 그렇습니다. 운영 DB 가 따로 있는 게 아닙니다.

          ══════════════════════════════════════════════════════════════
          ⚪ 이건 참고용입니다 (급하면 안 봐도 됩니다)
          ══════════════════════════════════════════════════════════════
            ${ARCHIVE_FILE}
            상태: $(MARK "$ARCHIVE_FILE")

            Supabase 프로젝트 'beauty-platform'. 이름은 운영이지만
            현재 이 DB 를 바라보는 서비스가 없습니다. 과거 데이터 보존용입니다.

          ── 복구 방법 ────────────────────────────────────────────────
            gunzip -c <파일> | psql "<Supabase Session pooler 주소 5432>"

            ⚠️ 되돌릴 수 없습니다. 지금 DB 를 먼저 덤프해두고 하세요.
            ⚠️ pg_dump/psql 은 Session pooler(5432)로. Transaction(6543) 아닙니다.
          EOF
          cat backup/README.txt

      - name: Backup summary
        if: always()
        run: |
          echo "=== 백업 결과 ==="
          echo "LIVE (실데이터) : ${{ steps.live.outcome }}"
          echo "ARCHIVE         : ${{ steps.archive.outcome }}"
          ls -lh backup/ 2>/dev/null | tail -5 || echo "(생성된 파일 없음)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-backup-${{ env.BACKUP_TS }}
          path: |
            backup/*.sql.gz
            backup/README.txt
          retention-days: 30
          if-no-files-found: warn

      # 알림을 게이트보다 먼저 — 게이트가 job 을 끝내버리기 전에 보낸다.
      - name: Notify Discord on failure
        if: always() && (steps.live.outcome == 'failure' || steps.archive.outcome == 'failure')
        env:
          WEBHOOK: ${{ secrets.SUPPORT_DISCORD_WEBHOOK }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SUPPORT_DISCORD_WEBHOOK 미설정 — 실패 알림을 보낼 수 없습니다"
            exit 0
          fi
          ICON() { [ "$1" = "failure" ] && echo "❌ 실패" || echo "✅ 성공"; }
          # 실데이터가 실패한 날은 제목부터 다르게 — 둘을 같은 무게로 보면 안 된다.
          if [ "$LIVE_OUTCOME" = "failure" ]; then
            HEAD='🚨🚨 **실사용자 데이터 백업 실패** — 오늘 백업본이 없습니다'
          else
            HEAD='⚠️ **Supabase 백업 일부 실패** (실데이터는 정상)'
          fi
          MSG=$(printf '%s\n· 🔴 LIVE (실데이터, itdasy-staging): %s\n· ⚪ ARCHIVE (beauty-platform): %s\n· 로그: %s' \
            "$HEAD" "$(ICON "$LIVE_OUTCOME")" "$(ICON "$ARCHIVE_OUTCOME")" "$RUN_URL")
          jq -nc --arg c "$MSG" '{content:$c}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" \
            && echo "Discord 알림 전송됨"

      - name: Fail job if any dump failed
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.live.outcome }}" = "failure" ]; then
            echo "::error::LIVE(실데이터) 백업 실패 — 최우선 확인"; FAILED=1
          fi
          if [ "${{ steps.archive.outcome }}" = "failure" ]; then
            echo "::error::ARCHIVE 백업 실패"; FAILED=1
          fi
          exit $FAILED
