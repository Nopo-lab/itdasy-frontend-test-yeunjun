name: Supabase Daily Backup

# 매일 UTC 18:00 (한국 03:00) 운영 + 스테이징 두 DB를 pg_dump → artifact 저장
# 필요 secrets:
#   SUPABASE_PROD_DB_URL     : 운영 (beauty-platform / wlwauinqvmegnqdtbrtg)
#   SUPABASE_STAGING_DB_URL  : 스테이징 (itdasy-staging / hsxxqomfbdernepykils) ← 실데이터가 여기 있음
#   SUPPORT_DISCORD_WEBHOOK  : (선택) 실패 시 알림. 없으면 알림만 건너뜀
#
# ⚠️ 두 덤프는 서로 독립이다. 한쪽이 실패해도 다른 쪽은 반드시 시도한다.
#    (2026-09-03~06: PROD 인증 실패가 STAGING 스텝까지 skip 시켜서 실데이터 백업이 4일 비었다)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install postgresql-client v17 (Supabase Postgres 17 호환)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo sh /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Prepare backup directory
        run: |
          mkdir -p backup
          TS=$(date -u +%Y%m%d_%H%M)
          echo "BACKUP_TS=$TS" >> $GITHUB_ENV

      - name: Dump production DB (beauty-platform)
        id: prod
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_PROD_DB_URL 미설정 — 운영 백업 건너뜀"
            exit 0
          fi
          FILE="backup/itdasy_PROD_${BACKUP_TS}.sql.gz"
          # 실패하면 파일을 지운다 — 20바이트짜리 빈 gzip 이 artifact 에 섞이면
          # 나중에 그걸 백업인 줄 알고 집는다. 없는 편이 낫다.
          if ! /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-acl --format=plain "$DB_URL" | gzip > "$FILE"; then
            rm -f "$FILE"
            echo "::error::PROD 덤프 실패 (접속·인증 확인)"
            exit 1
          fi
          ls -lh "$FILE"
          if [ $(stat -c%s "$FILE") -lt 1024 ]; then
            rm -f "$FILE"
            echo "::error::PROD 덤프 파일이 너무 작습니다 (빈 백업). 1KB 이상이어야 정상."
            exit 1
          fi

      - name: Dump staging DB (itdasy-staging)
        id: staging
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_STAGING_DB_URL 미설정 — 스테이징 백업 건너뜀"
            exit 0
          fi
          FILE="backup/itdasy_STAGING_${BACKUP_TS}.sql.gz"
          if ! /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-acl --format=plain "$DB_URL" | gzip > "$FILE"; then
            rm -f "$FILE"
            echo "::error::STAGING 덤프 실패 (접속·인증 확인)"
            exit 1
          fi
          ls -lh "$FILE"
          if [ $(stat -c%s "$FILE") -lt 1024 ]; then
            rm -f "$FILE"
            echo "::error::STAGING 덤프 파일이 너무 작습니다 (빈 백업). 1KB 이상이어야 정상."
            exit 1
          fi

      - name: Backup summary
        if: always()
        run: |
          echo "=== 백업 결과 ==="
          echo "PROD    : ${{ steps.prod.outcome }}"
          echo "STAGING : ${{ steps.staging.outcome }}"
          ls -lh backup/ 2>/dev/null | tail -5 || echo "(생성된 파일 없음)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-backup-${{ env.BACKUP_TS }}
          path: backup/*.sql.gz
          retention-days: 30
          if-no-files-found: warn

      # 알림을 게이트보다 먼저 — 게이트가 job 을 끝내버리기 전에 보낸다.
      - name: Notify Discord on failure
        if: always() && (steps.prod.outcome == 'failure' || steps.staging.outcome == 'failure')
        env:
          WEBHOOK: ${{ secrets.SUPPORT_DISCORD_WEBHOOK }}
          PROD_OUTCOME: ${{ steps.prod.outcome }}
          STAGING_OUTCOME: ${{ steps.staging.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::SUPPORT_DISCORD_WEBHOOK 미설정 — 실패 알림을 보낼 수 없습니다"
            exit 0
          fi
          ICON() { [ "$1" = "failure" ] && echo "❌ 실패" || echo "✅ 성공"; }
          MSG=$(printf '🚨 **Supabase 백업 실패**\n· 운영(beauty-platform): %s\n· 스테이징(itdasy-staging, 실데이터): %s\n· 로그: %s' \
            "$(ICON "$PROD_OUTCOME")" "$(ICON "$STAGING_OUTCOME")" "$RUN_URL")
          jq -nc --arg c "$MSG" '{content:$c}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" \
            && echo "Discord 알림 전송됨"

      - name: Fail job if any dump failed
        if: always()
        run: |
          FAILED=0
          if [ "${{ steps.prod.outcome }}" = "failure" ]; then
            echo "::error::PROD 백업 실패"; FAILED=1
          fi
          if [ "${{ steps.staging.outcome }}" = "failure" ]; then
            echo "::error::STAGING 백업 실패"; FAILED=1
          fi
          exit $FAILED
