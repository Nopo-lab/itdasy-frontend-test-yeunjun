<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잇데이 비밀번호 재설정</title>
  <style>
    /* [2026-07-20 v780] 비밀번호 재설정 독립 페이지 — 로그인 화면 톤 그대로 (라이트 전용) */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #fff; color: #191F28; letter-spacing: -.3px;
    }
    .box { width: 100%; max-width: 340px; }
    .wordmark { font-size: 28px; font-weight: 800; letter-spacing: -1px; text-align: center; margin-bottom: 6px; }
    .wordmark .wm-accent { color: #D58A95; }
    .title { font-size: 19px; font-weight: 800; text-align: center; margin: 26px 0 6px; }
    .sub { font-size: 13.5px; color: #98A1AC; text-align: center; line-height: 1.6; margin: 0 0 22px; font-weight: 500; }
    .pw-field { position: relative; margin-bottom: 9px; }
    .field {
      width: 100%; height: 54px; border-radius: 14px; background: #F4F6F8;
      border: 1px solid transparent; padding: 0 48px 0 16px;
      font-size: 14.5px; font-weight: 500; color: #191F28; font-family: inherit;
      letter-spacing: -.3px; outline: none; transition: border-color .15s, background .15s;
    }
    .field::placeholder { color: #A6AEB8; font-weight: 400; }
    .field:focus { border-color: #D58A95; background: #fff; }
    .pw-eye {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; border: none; background: transparent;
      cursor: pointer; color: #9aa3ac; display: flex; align-items: center; justify-content: center;
    }
    .err { font-size: 13px; color: #E05555; font-weight: 500; text-align: center; margin: 4px 0 10px; display: none; line-height: 1.5; }
    .cta {
      width: 100%; height: 54px; border-radius: 14px; background: #D58A95; color: #fff;
      font-size: 15px; font-weight: 800; border: none; cursor: pointer; font-family: inherit;
      letter-spacing: -.3px; margin-top: 6px; transition: transform .12s ease-out;
    }
    .cta:active { transform: scale(.985); }
    .cta:disabled { opacity: .6; cursor: default; }
    .btn-back {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 54px; border-radius: 14px; background: #191F28; color: #fff;
      font-size: 15px; font-weight: 800; text-decoration: none; font-family: inherit;
      letter-spacing: -.3px; margin-top: 18px; transition: transform .12s ease-out;
    }
    .btn-back:active { transform: scale(.985); }
    .view { display: none; }
    .view.on { display: block; }
    .mark { width: 56px; height: 56px; border-radius: 999px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    .mark--ok { background: #FBF1F3; color: #D58A95; }
    .mark--warn { background: #F4F6F8; color: #98A1AC; }
  </style>
</head>
<body>
  <div class="box">
    <div class="wordmark">Itda<span class="wm-accent">sy</span></div>

    <!-- 새 비밀번호 입력 -->
    <div class="view" id="viewForm">
      <div class="title">새 비밀번호 만들기</div>
      <p class="sub">새로 쓸 비밀번호를 입력해주세요.<br>8자 이상, 영문과 숫자를 함께 넣어주세요.</p>
      <div class="pw-field">
        <input type="password" class="field" id="pw1" placeholder="새 비밀번호" autocomplete="new-password">
        <button type="button" class="pw-eye" data-eye="pw1" aria-label="비밀번호 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="pw-field">
        <input type="password" class="field" id="pw2" placeholder="새 비밀번호 한 번 더" autocomplete="new-password">
        <button type="button" class="pw-eye" data-eye="pw2" aria-label="비밀번호 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err" id="formErr"></div>
      <button class="cta" id="submitBtn">비밀번호 바꾸기</button>
    </div>

    <!-- 성공 -->
    <div class="view" id="viewDone">
      <div class="mark mark--ok">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="title">비밀번호를 바꿨어요</div>
      <p class="sub">이제 새 비밀번호로 로그인할 수 있어요.</p>
      <a class="btn-back" href="index.html">로그인하러 가기</a>
    </div>

    <!-- 링크 만료/무효 -->
    <div class="view" id="viewExpired">
      <div class="mark mark--warn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </div>
      <div class="title">링크가 만료됐어요</div>
      <p class="sub">로그인 화면에서 '비밀번호를 잊으셨나요?'를 눌러<br>재설정 메일을 다시 받아주세요.</p>
      <a class="btn-back" href="index.html">로그인 화면으로</a>
    </div>

    <!-- 링크 파라미터 없음 -->
    <div class="view" id="viewInvalid">
      <div class="mark mark--warn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </div>
      <div class="title">잘못된 접근이에요</div>
      <p class="sub">메일에 있는 버튼을 눌러 다시 들어와주세요.</p>
      <a class="btn-back" href="index.html">로그인 화면으로</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      // [2026-05-04 booking-confirm.html 패턴] 환경별 API 자동 선택 (test 레포 → 스테이징)
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      var API = isLocal
        ? 'http://localhost:8000'
        : 'https://itdasy-backend-staging-644329093453.asia-northeast3.run.app';
      function apiFetch(path, opts) {
        return fetch(API + (path.charAt(0) === '/' ? path : '/' + path), opts);
      }

      function show(id) {
        ['viewForm', 'viewDone', 'viewExpired', 'viewInvalid'].forEach(function (v) {
          document.getElementById(v).classList.toggle('on', v === id);
        });
      }

      var token = new URLSearchParams(window.location.search).get('token');
      if (!token) { show('viewInvalid'); return; }
      show('viewForm');

      // 비밀번호 보기 토글
      document.querySelectorAll('.pw-eye').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.getAttribute('data-eye'));
          input.type = (input.type === 'password') ? 'text' : 'password';
        });
      });

      var errEl = document.getElementById('formErr');
      function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }

      var submitBtn = document.getElementById('submitBtn');
      var inFlight = false;
      submitBtn.addEventListener('click', function () {
        if (inFlight) return;
        errEl.style.display = 'none';
        var pw1 = document.getElementById('pw1').value;
        var pw2 = document.getElementById('pw2').value;
        // 클라이언트 검증 — 백엔드 규칙과 동일 (8자 이상 + 영문 + 숫자)
        if (pw1.length < 8 || !/[a-zA-Z]/.test(pw1) || !/[0-9]/.test(pw1)) {
          showErr('비밀번호는 8자 이상, 영문과 숫자를 함께 넣어주세요.');
          return;
        }
        if (pw1 !== pw2) { showErr('두 비밀번호가 달라요. 다시 확인해주세요.'); return; }

        inFlight = true;
        submitBtn.disabled = true;
        submitBtn.textContent = '바꾸는 중...';
        apiFetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: pw1 })
        }).then(function (res) {
          if (res.ok) { show('viewDone'); return; }
          // 400류 = 링크 만료/이미 사용됨
          if (res.status >= 400 && res.status < 500) { show('viewExpired'); return; }
          showErr('서버가 잠깐 불안정해요. 잠시 후 다시 시도해주세요.');
        }).catch(function () {
          showErr('인터넷 연결을 확인해주세요.');
        }).finally(function () {
          inFlight = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '비밀번호 바꾸기';
        });
      });
    })();
  </script>
</body>
</html>
